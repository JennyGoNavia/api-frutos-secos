<script>
const API = 'https://api-frutos-secos.onrender.com';

let token = localStorage.getItem('token') || '';
let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`
  };
}

// 🔥 API MEJORADA
async function api(method, path, body) {
  try {
    const res = await fetch(API + path, {
      method,
      headers: authHeaders(),
      body: body ? JSON.stringify(body) : undefined,
    });

    if (res.status === 401) {
      logout();
      return null;
    }

    const data = await res.json();

    if (!res.ok) {
      console.error("API ERROR:", data);
      return { error: data.error || "Error servidor" };
    }

    return data;
  } catch (err) {
    console.error("FETCH ERROR:", err);
    return { error: "No conecta con API" };
  }
}

function toast(msg, ok = true) {
  const t = document.createElement('div');
  t.className = `toast ${ok ? 'toast-ok' : 'toast-err'}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function fmt(n) { return '$' + Number(n).toLocaleString('es-CL'); }
function fmtDate(d) { return new Date(d).toLocaleDateString('es-CL'); }

function getNombreProducto(v) {
  if (v.productoId && typeof v.productoId === 'object') return v.productoId.nombre;
  return v.productoId || '—';
}

// ── LOGIN ─────────────────────
async function doLogin() {
  const username = inpUser.value.trim();
  const password = inpPass.value;
  loginError.style.display = 'none';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    const data = await res.json();

    if (!res.ok) {
      loginError.textContent = data.error || 'Error login';
      loginError.style.display = 'block';
      return;
    }

    token = data.token;
    currentUser = { nombre: data.nombre };

    localStorage.setItem('token', token);
    localStorage.setItem('currentUser', JSON.stringify(currentUser));

    showDashboard();

  } catch {
    loginError.textContent = 'Error conexión';
    loginError.style.display = 'block';
  }
}

function logout() {
  localStorage.clear();
  location.reload();
}

inpPass.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ── NAV ───────────────────────
function go(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.getElementById(`page-${page}`).classList.add('active');
  document.querySelector(`[onclick="go('${page}')"]`).classList.add('active');

  loadPage(page);
}

function showDashboard() {
  loginScreen.style.display = 'none';
  dashboard.style.display = 'block';

  topbarName.textContent = currentUser.nombre;
  topbarAvatar.textContent = currentUser.nombre[0];

  loadPage('resumen');
}

// ── LOADERS ───────────────────
async function loadPage(page) {
  if (page === 'resumen') await loadResumen();
  if (page === 'productos') await loadProductos();
  if (page === 'ventas') {
    await loadVentas();
    await fillProductoSelect();
  }
  if (page === 'ganancias') await loadGanancias();
}

// 🔥 RESUMEN MEJORADO
async function loadResumen() {
  const [prods, ventas, gans] = await Promise.all([
    api('GET', '/productos'),
    api('GET', '/ventas'),
    api('GET', '/ventas/ganancias')
  ]);

  statProductos.textContent = prods?.length ?? '—';
  statVentas.textContent = ventas?.length ?? '—';

  const total = (gans || []).reduce((s, g) => s + g.totalGanancia, 0);
  statGanancia.textContent = fmt(total);

  const ultimas = (ventas || [])
    .sort((a,b) => new Date(b.fecha) - new Date(a.fecha))
    .slice(0,5);

  tblUltimas.innerHTML = ultimas.length ? ultimas.map(v => `
    <tr>
      <td>${fmtDate(v.fecha)}</td>
      <td>${getNombreProducto(v)}</td>
      <td>${v.vendedorId}</td>
      <td>${v.cantidad}</td>
      <td><span class="badge badge-green">${fmt(v.ganancia)}</span></td>
    </tr>
  `).join('') : '<tr><td colspan="5" class="empty">Sin ventas</td></tr>';
}

// PRODUCTOS
let sortAsc = true;

async function loadProductos() {
  const data = await api('GET', '/productos');

  const sorted = (data || []).sort((a,b) =>
    sortAsc ? a.nombre.localeCompare(b.nombre) : b.nombre.localeCompare(a.nombre)
  );

  tblProductos.innerHTML = sorted.length ? sorted.map(p => `
    <tr>
      <td>${p.nombre}</td>
      <td>${fmt(p.costoBase)}</td>
      <td>${fmt(p.costoInsumos)}</td>
      <td><span class="badge badge-orange">${p.stock}</span></td>
      <td>
        <button onclick="eliminarProducto('${p._id}')">🗑</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="5" class="empty">Sin productos</td></tr>';
}

function toggleSort() {
  sortAsc = !sortAsc;
  loadProductos();
}

async function eliminarProducto(id) {
  if (!confirm('Eliminar?')) return;

  const res = await api('DELETE', `/productos/${id}`);
  if (!res.error) {
    toast('Eliminado');
    loadProductos();
  }
}

// VENTAS
async function loadVentas() {
  const data = await api('GET', '/ventas');

  tblVentas.innerHTML = (data || []).length ? data.map(v => `
    <tr>
      <td>${fmtDate(v.fecha)}</td>
      <td>${getNombreProducto(v)}</td>
      <td>${v.vendedorId}</td>
      <td>${v.cantidad}</td>
      <td>${fmt(v.precioVenta)}</td>
      <td><span class="badge badge-green">${fmt(v.ganancia)}</span></td>
    </tr>
  `).join('') : '<tr><td colspan="6" class="empty">Sin ventas</td></tr>';
}

// GANANCIAS
async function loadGanancias() {
  const data = await api('GET', '/ventas/ganancias');

  tblGanancias.innerHTML = (data || []).length ? data.map(g => `
    <tr>
      <td>${g._id}</td>
      <td><span class="badge badge-green">${fmt(g.totalGanancia)}</span></td>
    </tr>
  `).join('') : '<tr><td colspan="2" class="empty">Sin datos</td></tr>';
}

// SELECT PRODUCTOS
async function fillProductoSelect() {
  const prods = await api('GET', '/productos');

  vtProducto.innerHTML = '<option value="">Selecciona…</option>' +
    (prods || []).map(p =>
      `<option value="${p._id}">${p.nombre}</option>`
    ).join('');
}

// CREAR PRODUCTO
async function crearProducto() {
  const body = {
    nombre: pNombre.value.trim(),
    costoBase: Number(pCostoBase.value),
    costoInsumos: Number(pCostoInsumos.value),
    stock: Number(pStock.value),
  };

  if (!body.nombre) return toast('Nombre requerido', false);

  const res = await api('POST', '/productos', body);

  if (!res.error) {
    toast('Producto creado');
    loadProductos();
    loadResumen();
  }
}

// CREAR VENTA
async function crearVenta() {
  const body = {
    productoId: vtProducto.value,
    cantidad: Number(vtCantidad.value),
    precioVenta: Number(vtPrecio.value),
  };

  if (!body.productoId) return toast('Selecciona producto', false);

  const res = await api('POST', '/ventas', body);

  if (!res.error) {
    toast('Venta registrada');
    loadVentas();
    loadResumen(); // 🔥 CLAVE
  }
}

// INIT
if (token && currentUser) showDashboard();
</script>
